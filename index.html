<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 to-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800/80 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">🎶 Online Music Player</h1>

        <!-- Search Bar -->
        <div class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search song or artist..." 
                class="w-full p-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:outline-none focus:border-purple-400 text-white"
            >
            <button 
                onclick="searchMusic()" 
                class="bg-purple-600 hover:bg-purple-700 px-4 py-3 rounded-xl font-semibold transition">
                Search
            </button>
        </div>

        <!-- Current Playing Info -->
        <div class="text-center mb-6">
            <h2 id="songTitle" class="text-xl font-semibold">Select or Search a Song</h2>
            <p id="artistName" class="text-sm text-gray-400">Ready to play</p>
        </div>

        <!-- Audio Player Element -->
        <audio id="audioPlayer" class="w-full mb-6 rounded-lg" controls></audio>

        <!-- Result / Playlist Container -->
        <div class="flex flex-col gap-3">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Playlist & Results</h3>
            <div id="songList" class="flex flex-col gap-2">
                
                <!-- Default Song 1 -->
                <div class="flex items-center justify-between p-3 bg-gray-700/50 rounded-xl border border-gray-600/50">
                    <span class="font-medium">🎵 Song One (Demo)</span>
                    <button onclick="playSong('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 'Song One - Electronic Mix', 'SoundHelix')" 
                        class="text-xs text-purple-400 bg-purple-900/40 px-3 py-1 rounded-md">Play</button>
                </div>

                <!-- Default Song 2 -->
                <div class="flex items-center justify-between p-3 bg-gray-700/50 rounded-xl border border-gray-600/50">
                    <span class="font-medium">🎵 Song Two (Demo)</span>
                    <button onclick="playSong('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 'Song Two - Chill Vibe', 'SoundHelix')" 
                        class="text-xs text-purple-400 bg-purple-900/40 px-3 py-1 rounded-md">Play</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const songTitle = document.getElementById('songTitle');
        const artistName = document.getElementById('artistName');

        function searchMusic() {
            const query = document.getElementById('searchInput').value;
            if(!query) {
                alert('Enthenkilum song peru type cheyoo!');
                return;
            }

            const songList = document.getElementById('songList');
            
            // Search result-il user adicha perum, oru sample play button-um varum
            songList.innerHTML = `
                <div class="flex items-center justify-between p-3 bg-gray-700/50 rounded-xl border border-gray-600/50 animate-pulse">
                    <span class="font-medium">🎵 ${query} (Match Found)</span>
                    <button onclick="playSong('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', '${query}', 'Searched Audio')" 
                        class="text-xs text-purple-400 bg-purple-900/40 px-3 py-1 rounded-md">Play</button>
                </div>
            `;
        }

        function playSong(url, title, artist) {
            audioPlayer.src = url;
            songTitle.innerText = title;
            artistName.innerText = artist;
            audioPlayer.play();
        }
    </script>

</body>
</html>
