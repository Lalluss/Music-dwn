<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Malayalam Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 to-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800/80 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">🎶 Malayalam Music Vibe</h1>

        <!-- Search Bar (Instant Filter) -->
        <div class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="searchInput" 
                onkeyup="filterSongs()"
                placeholder="Search Malayalam songs..." 
                class="w-full p-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:outline-none focus:border-purple-400 text-white"
            >
        </div>

        <!-- Current Playing Info -->
        <div class="text-center mb-6">
            <h2 id="songTitle" class="text-xl font-semibold">Select a song</h2>
            <p id="artistName" class="text-sm text-gray-400">Ready to play</p>
        </div>

        <!-- Audio Player Element -->
        <audio id="audioPlayer" class="w-full mb-6 rounded-lg" controls></audio>

        <!-- Playlist Container -->
        <div class="flex flex-col gap-3">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Playlist</h3>
            <div id="songList" class="flex flex-col gap-2 max-h-60 overflow-y-auto pr-1">
                
                <!-- Song 1 -->
                <div class="song-item flex items-center justify-between p-3 bg-gray-700/50 rounded-xl border border-gray-600/50" data-title="Enthinu veroru">
                    <div class="overflow-hidden pr-2">
                        <p class="font-medium text-sm truncate">🎵 Enthinu Veroru</p>
                        <p class="text-xs text-gray-400">Malayalam Melody</p>
                    </div>
                    <button onclick="playSong('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 'Enthinu Veroru', 'Malayalam Melody')" 
                        class="text-xs text-purple-400 bg-purple-900/40 px-3 py-1 rounded-md shrink-0">Play</button>
                </div>

                <!-- Song 2 -->
                <div class="song-item flex items-center justify-between p-3 bg-gray-700/50 rounded-xl border border-gray-600/50" data-title="Aaranu ninte">
                    <div class="overflow-hidden pr-2">
                        <p class="font-medium text-sm truncate">🎵 Raavukalil</p>
                        <p class="text-xs text-gray-400">Romantic Hit</p>
                    </div>
                    <button onclick="playSong('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 'Raavukalil', 'Romantic Hit')" 
                        class="text-xs text-purple-400 bg-purple-900/40 px-3 py-1 rounded-md shrink-0">Play</button>
                </div>

                <!-- Song 3 -->
                <div class="song-item flex items-center justify-between p-3 bg-gray-700/50 rounded-xl border border-gray-600/50" data-title="Kavalach ചുറ്റും">
                    <div class="overflow-hidden pr-2">
                        <p class="font-medium text-sm truncate">🎵 Neela Kuyile</p>
                        <p class="text-xs text-gray-400">Classic Malayalam</p>
                    </div>
                    <button onclick="playSong('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', 'Neela Kuyile', 'Classic Malayalam')" 
                        class="text-xs text-purple-400 bg-purple-900/40 px-3 py-1 rounded-md shrink-0">Play</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const songTitle = document.getElementById('songTitle');
        const artistName = document.getElementById('artistName');

        function playSong(url, title, artist) {
            songTitle.innerText = title;
            artistName.innerText = artist;
            audioPlayer.src = url;
            audioPlayer.play();
        }

        function filterSongs() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const items = document.getElementsByClassName('song-item');

            for (let i = 0; i < items.length; i++) {
                const title = items[i].getAttribute('data-title').toLowerCase();
                if (title.includes(input)) {
                    items[i].style.display = "flex";
                } else {
                    items[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
