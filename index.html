<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 to-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800/80 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">🎶 Fast Music Player</h1>

        <!-- Search Bar -->
        <div class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Type song name..." 
                class="w-full p-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:outline-none focus:border-purple-400 text-white"
            >
            <button 
                onclick="searchMusic()" 
                class="bg-purple-600 hover:bg-purple-700 px-4 py-3 rounded-xl font-semibold transition">
                Search
            </button>
        </div>

        <!-- Current Playing Info -->
        <div class="text-center mb-6">
            <h2 id="songTitle" class="text-xl font-semibold">Search any song</h2>
            <p id="artistName" class="text-sm text-gray-400">Ready to play</p>
        </div>

        <!-- Audio Player Element -->
        <audio id="audioPlayer" class="w-full mb-6 rounded-lg" controls></audio>

        <!-- Result / Playlist Container -->
        <div class="flex flex-col gap-3">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Results</h3>
            <div id="songList" class="flex flex-col gap-2">
                <p class="text-xs text-gray-400 text-center py-2">Type and search your favorite tracks!</p>
            </div>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const songTitle = document.getElementById('songTitle');
        const artistName = document.getElementById('artistName');

        async function searchMusic() {
            const query = document.getElementById('searchInput').value;
            if(!query) {
                alert('Enthenkilum song peru type cheyoo!');
                return;
            }

            const songList = document.getElementById('songList');
            songList.innerHTML = `<p class="text-xs text-purple-400 text-center py-2 animate-pulse">Searching...</p>`;

            try {
                // Free public iTunes / Audio Search API (Fast and working without CORS issue)
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=5`);
                const data = await response.json();
                const items = data.results;

                if(!items || items.length === 0) {
                    songList.innerHTML = `<p class="text-xs text-red-400 text-center py-2">No songs found!</p>`;
                    return;
                }

                songList.innerHTML = '';
                items.forEach(item => {
                    const title = item.trackName;
                    const artist = item.artistName;
                    const audioUrl = item.previewUrl; // 30-sec High quality preview direct mp3 url

                    songList.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-gray-700/50 rounded-xl border border-gray-600/50">
                            <div class="overflow-hidden pr-2">
                                <p class="font-medium text-sm truncate">🎵 ${title}</p>
                                <p class="text-xs text-gray-400 truncate">${artist}</p>
                            </div>
                            <button onclick="playSong('${audioUrl}', '${title.replace(/'/g, "")}', '${artist.replace(/'/g, "")}')" 
                                class="text-xs text-purple-400 bg-purple-900/40 px-3 py-1 rounded-md shrink-0">Play</button>
                        </div>
                    `;
                });

            } catch (err) {
                songList.innerHTML = `<p class="text-xs text-red-400 text-center py-2">Error connecting API. Try again!</p>`;
            }
        }

        function playSong(url, title, artist) {
            if(!url) {
                alert('Audio preview link kitteyilla!');
                return;
            }
            songTitle.innerText = title;
            artistName.innerText = artist;
            audioPlayer.src = url;
            audioPlayer.play();
        }
    </script>

</body>
</html>
