<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 to-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800/80 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">🎶 Online Music Player</h1>

        <!-- Search Bar -->
        <div class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search any song..." 
                class="w-full p-3 bg-gray-700/50 border border-gray-600 rounded-xl focus:outline-none focus:border-purple-400 text-white"
            >
            <button 
                onclick="searchMusic()" 
                class="bg-purple-600 hover:bg-purple-700 px-4 py-3 rounded-xl font-semibold transition">
                Search
            </button>
        </div>

        <!-- Current Playing Info -->
        <div class="text-center mb-6">
            <h2 id="songTitle" class="text-xl font-semibold">Type a song & hit search</h2>
            <p id="artistName" class="text-sm text-gray-400">Ready to play</p>
        </div>

        <!-- Audio Player Element -->
        <audio id="audioPlayer" class="w-full mb-6 rounded-lg" controls></audio>

        <!-- Result / Playlist Container -->
        <div class="flex flex-col gap-3">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Results</h3>
            <div id="songList" class="flex flex-col gap-2">
                <p class="text-xs text-gray-400 text-center py-2">No search results yet.</p>
            </div>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const songTitle = document.getElementById('songTitle');
        const artistName = document.getElementById('artistName');

        async function searchMusic() {
            const query = document.getElementById('searchInput').value;
            if(!query) {
                alert('Enthenkilum song peru type cheyoo!');
                return;
            }

            const songList = document.getElementById('songList');
            songList.innerHTML = `<p class="text-xs text-purple-400 text-center py-2 animate-pulse">Searching internet...</p>`;

            try {
                // Free Internet Archive Audio Search API
                const response = await fetch(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=identifier&fl[]=title&fl[]=creator&rows=5&output=json`);
                const data = await response.json();
                const docs = data.response.docs;

                if(docs.length === 0) {
                    songList.innerHTML = `<p class="text-xs text-red-400 text-center py-2">No songs found!</p>`;
                    return;
                }

                songList.innerHTML = '';
                docs.forEach(doc => {
                    const title = doc.title || query;
                    const creator = doc.creator || 'Unknown Artist';
                    const identifier = doc.identifier;
                    
                    // Direct stream link from Archive.org
                    const audioUrl = `https://archive.org/download/${identifier}/${identifier}_vbr.m3u8` or `https://archive.org/download/${identifier}`;

                    songList.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-gray-700/50 rounded-xl border border-gray-600/50">
                            <div class="overflow-hidden pr-2">
                                <p class="font-medium text-sm truncate">🎵 ${title}</p>
                                <p class="text-xs text-gray-400 truncate">${creator}</p>
                            </div>
                            <button onclick="playArchiveSong('${identifier}', '${title.replace(/'/g, "")}', '${creator}')" 
                                class="text-xs text-purple-400 bg-purple-900/40 px-3 py-1 rounded-md shrink-0">Play</button>
                        </div>
                    `;
                });

            } catch (err) {
                songList.innerHTML = `<p class="text-xs text-red-400 text-center py-2">Error fetching songs. Try again!</p>`;
            }
        }

        async function playArchiveSong(identifier, title, artist) {
            songTitle.innerText = title;
            artistName.innerText = artist;
            
            // Fetch metadata to get actual MP3 file link
            try {
                const res = await fetch(`https://archive.org/metadata/${identifier}`);
                const data = await res.json();
                const files = data.files;
                
                // Find mp3 file
                const mp3File = files.find(f => f.name.endsWith('.mp3'));
                if(mp3File) {
                    const directUrl = `https://archive.org/download/${identifier}/${mp3File.name}`;
                    audioPlayer.src = directUrl;
                    audioPlayer.play();
                } else {
                    alert('Sorry, playable MP3 not found for this item!');
                }
            } catch (e) {
                alert('Error loading song audio!');
            }
        }
    </script>

</body>
</html>
